<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wren</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            font-weight: bold;
        }
        h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .bio {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .social-links a {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        .social-links a:hover {
            transform: translateY(-3px);
            background: #e8e8e8;
        }
        .social-links svg {
            width: 20px;
            height: 20px;
            fill: #333;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">W</div>
        <h1>Wren</h1>
        <p class="bio">你好！我是 Wren，一个热爱技术与创造的开发者。欢迎来到我的个人主页。</p>
        <div class="social-links">
            <a href="https://github.com/Wren-gxr" title="GitHub">

            </a>
        </div>

</body>
</html>
